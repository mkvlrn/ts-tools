name: publish

on:
  release:
    types:
      - published

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_TOKEN: ${{ secrets.NPM_CONFIG_TOKEN }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5

      - name: Publish app-error
        if: startsWith(github.event.release.tag_name, 'app-error-v')
        run: mise run publish app-error

      - name: Publish config
        if: startsWith(github.event.release.tag_name, 'config-v')
        run: mise run publish config

      - name: Publish result
        if: startsWith(github.event.release.tag_name, 'result-v')
        run: mise run publish result
