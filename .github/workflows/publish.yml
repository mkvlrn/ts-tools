name: publish

on:
  release:
    types:
      - published

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - name: Publish app-error to JSR
        if: startsWith(github.event.release.tag_name, 'app-error-v')
        working-directory: ./packages/app-error
        run: |
          bun install --production --ignore-scripts
          bunx jsr publish

      - name: Publish config to JSR
        if: startsWith(github.event.release.tag_name, 'config-v')
        working-directory: ./packages/config
        run: bunx jsr publish

      - name: Publish result to JSR
        if: startsWith(github.event.release.tag_name, 'result-v')
        working-directory: ./packages/result
        run: bunx jsr publish
