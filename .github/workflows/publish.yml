name: Publish

on:
  workflow_run:
    workflows:
      - checks
    types:
      - completed

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  id-token: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: jdx/mise-action@v4
      - name: get mise cache directory
        shell: bash
        run: echo "MISE_CACHE_PATH=$(mise config show.cache.dir 2>/dev/null || echo ~/.local/cache/mise)" >> $GITHUB_ENV
      - uses: actions/cache@v6
        with:
          path: ${{ env.MISE_CACHE_PATH }}
          key: ${{ runner.os }}-mise-cache-${{ hashFiles('.mise/**') }}
          restore-keys: ${{ runner.os }}-mise-cache-
      - uses: actions/checkout@v7
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish app-error to JSR
        if: ${{ steps.release.outputs['packages/app-error--release_created'] }}
        working-directory: ./packages/pkg-a
        run: bunx jsr publish

      - name: Publish config to JSR
        if: ${{ steps.release.outputs['packages/config--release_created'] }}
        working-directory: ./packages/pkg-b
        run: bunx jsr publish

      - name: Publish result to JSR
        if: ${{ steps.release.outputs['packages/result--release_created'] }}
        working-directory: ./packages/pkg-b
        run: bunx jsr publish
