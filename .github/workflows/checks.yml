name: checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5

      - run: bun install --frozen-lockfile
      - run: mise run typecheck
      - run: mise run lint
      - run: mise run test-ci
      - run: mise run jsr-dry-run
