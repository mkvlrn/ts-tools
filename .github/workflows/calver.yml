name: Test CalVer

on:
  workflow_dispatch:

jobs:
  calver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calculate version
        id: calver
        shell: bash
        run: |
          month="$(date -u +'%Y.%m')"
          latest="$(git tag -l "v$month.*" --sort=-v:refname | head -1)"

          if [[ -z "$latest" ]]; then
            patch=0
          else
            patch=$((${latest##*.} + 1))
          fi

          version="$month.$patch"

          echo "Latest: ${latest:-none}"
          echo "Next:   $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
