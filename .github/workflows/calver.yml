name: Test CalVer

on:
  workflow_dispatch:

jobs:
  calver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calculate version
        shell: bash
        run: |
          package="config"
          month="$(date -u +'%Y.%m')"
          latest="$(git tag -l "$package-v*" --sort=-v:refname | head -1)"

          echo "Latest tag: ${latest:-none}"

          if [[ "$latest" == "$package-v$month."* ]]; then
            patch=$((${latest##*.} + 1))
          else
            patch=0
          fi

          version="$month.$patch"
          echo "Next version: $version"
