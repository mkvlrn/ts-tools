[lint]
description = "Check files with biome"
run = """
mise exec -- biome check --no-errors-on-unmatched
"""

[lint-fix]
description = "Fix files with biome"
run = """
mise exec -- biome check --no-errors-on-unmatched --write
"""

[typecheck]
description = "Run tsc"
run = """
mise exec -- tsc
"""

[test]
description = "Run tests"
run = """
mise exec -- bun test --coverage
"""

[test-staged]
description = "Run tests on staged files"
run = """
mise exec -- bun test --changed --bail --reporter=dots
"""

[test-ci]
description = "Run tests in ci mode"
run = """
mise exec -- bun test --bail --reporter=dots
"""

[recreate-vitest-schema]
description = "Create vitest config json schema from vitest types"
run = """
mise exec -- bunx typescript-json-schema ./packages/config/tsconfig.schema.json UserConfig --include './packages/config/node_modules/vitest/**/*.d.ts' > ./packages/config/vitest.schema.json
"""

[publish-app-error]
description = "Build and publishes @mkvlrn/app-error to npm and jsr"
run = """
echo "Clean..."
rm -rf packages/app-error/dist

echo "Building @mkvlrn/app-error..."
mise exec -- bun build ./packages/app-error/src/main.ts --outdir ./packages/app-error/dist
mise exec -- tsc --declaration --emitDeclarationOnly --outDir packages/app-error/dist --module ESNext --moduleResolution Bundler packages/app-error/src/main.ts --ignoreConfig

echo "Publishing @mkvlrn/app-error to npm..."
(cd packages/app-error && mise exec -- npm publish --access public)

echo "Publishing @mkvlrn/app-error to jsr..."
(cd packages/app-error && mise exec -- jsr publish)
"""

[publish-config]
description = "Build and publishes @mkvlrn/config to npm and jsr"
run = """
echo "Building @mkvlrn/config..."
mise exec -- bun packages/config/scripts/build.ts

echo "Publishing @mkvlrn/config to npm..."
(cd packages/config && mise exec -- npm publish --access public)

echo "Publishing @mkvlrn/config to jsr..."
(cd packages/config && mise exec -- jsr publish)
"""

[publish-result]
description = "Build and publishes @mkvlrn/result to npm and jsr"
run = """
echo "Clean..."
rm -rf packages/result/dist

echo "Building @mkvlrn/result..."
mise exec -- bun build ./packages/result/src/main.ts --outdir ./packages/result/dist
mise exec -- tsc --declaration --emitDeclarationOnly --outDir packages/result/dist --module ESNext --moduleResolution Bundler packages/result/src/main.ts --ignoreConfig

echo "Publishing @mkvlrn/result to npm..."
(cd packages/result && mise exec -- npm publish --access public)

echo "Publishing @mkvlrn/result to jsr..."
(cd packages/result && mise exec -- jsr publish)
"""

[npm-dry-run]
description = "NPM publish dry run"
run = """
for dir in packages/*; do
  if [ -d "$dir" ]; then
    echo "Checking $dir"
    case "$dir" in
      packages/app-error)
        mise exec -- bun build ./packages/app-error/src/main.ts --outdir ./packages/app-error/dist
        mise exec -- tsc --declaration --emitDeclarationOnly --outDir packages/app-error/dist --module ESNext --moduleResolution Bundler packages/app-error/src/main.ts --ignoreConfig
        ;;
      packages/config)
        (cd "$dir" && mise exec -- bun scripts/build.ts)
        ;;
      packages/result)
        mise exec -- bun build ./packages/result/src/main.ts --outdir ./packages/result/dist
        mise exec -- tsc --declaration --emitDeclarationOnly --outDir packages/result/dist --module ESNext --moduleResolution Bundler packages/result/src/main.ts --ignoreConfig
        ;;
    esac
    (cd "$dir" && mise exec -- bun publish --dry-run --access public --quiet)
  fi
done
"""

[jsr-dry-run]
description = "JSR publish dry run"
run = """
for dir in packages/*; do
  if [ -d "$dir" ]; then
    echo "Checking $dir"
    if [ "$dir" = "packages/config" ]; then
      (cd "$dir" && mise exec -- bun scripts/build.ts)
    fi
    (cd "$dir" && mise exec -- jsr publish --dry-run --quiet --allow-dirty)
  fi
done
"""

[sync-branch]
description = "Sync package manager deps"
run = """
mise install
mise prune -y
mise exec -- bun install --frozen-lockfile
"""

[renovate-batch]
description = "Combine all open Renovate PRs into one PR"
run = """
set -euo pipefail

git fetch origin '+refs/heads/*:refs/remotes/origin/*'

batch_branch="renovate-batch"

if ! git diff --quiet || ! git diff --cached --quiet; then
  echo "Working tree is not clean"
  exit 1
fi

git branch -D "$batch_branch" 2>/dev/null || true
git push origin --delete "$batch_branch" 2>/dev/null || true

git switch -c "$batch_branch" origin/main

mapfile -t renovate_branches < <(
  gh pr list \
    --state open \
    --base main \
    --json headRefName \
    --jq '.[] | select(.headRefName | startswith("renovate/")) | .headRefName'
)

if [ "${#renovate_branches[@]}" -eq 0 ]; then
  echo "No open Renovate PRs found."
  git switch main
  git branch -D "$batch_branch"
  exit 0
fi

echo "Renovate PRs to batch:"
printf '  %s\\n' "${renovate_branches[@]}"

for branch in "${renovate_branches[@]}"; do
  echo
  echo "Merging $branch..."
  git merge --no-ff --no-edit "origin/$branch"
done

git push -u origin "$batch_branch"

gh pr create \
  --base main \
  --head "$batch_branch" \
  --title "chore(deps): batch Renovate updates" \
  --body "Batches the currently open Renovate PRs."

git switch main
"""
