[commit-msg.commands]
cog-lint = { run = "cog verify --file {1}" }

[pre-commit.commands]
lint = { glob = "*.{ts,tsx,json,jsonc}", run = "mise lint {staged_files}" }
typecheck = { glob = "*.{ts,tsx}", run = "mise typecheck" }
test = { glob = "*.{ts,tsx}", run = "mise test-staged" }

[pre-push.commands]
typecheck = { run = "mise typecheck" }
lint = { run = "mise lint" }
test = { run = "mise test-ci" }
jsr-dry-run = { run = "mise jsr-dry-run" }
npm-dry-run = { run = "mise npm-dry-run" }

[post-checkout.commands]
sync = { run = "mise sync-branch" }

[post-merge.commands]
sync = { run = "mise sync-branch" }
