[commit-msg.commands]
commitlint = { run = "mise run commitlint {1}" }

[pre-commit.commands]
check = { glob = "*.{ts,tsx,json,jsonc}", run = "mise run check -- {staged_files}" }
test = { glob = "*.{ts,tsx}", run = "mise run test -- --staged" }

[pre-push.commands]
check = { run = "mise run check" }
test = { run = "mise run test -- --ci" }

[post-checkout.commands]
sync = { run = "mise run sync-branch" }

[post-merge.commands]
sync = { run = "mise run sync-branch" }
