[tools]
biome = "2.5.7"
bun = "1.3.14"
cocogitto = "7.0.0"
lefthook = "2.1.10"
"npm:npm" = "12.0.2"
node = "26.7.0"
"npm:jsr" = "0.14.3"

[env]
_.path = ["./node_modules/.bin"]

[settings]
disable_backends = ["asdf"]
use_versions_host = false
minimum_release_age = "1d"

[tasks.dev]
description = "Dev mode"
run = "bun --watch src/main.ts"
[tasks.lint]
description = "Check files with biome"
run = "biome check --diagnostic-level=warn --no-errors-on-unmatched"
[tasks.lint-fix]
description = "Fix files with biome"
run = "biome check --diagnostic-level=warn --no-errors-on-unmatched --write"
[tasks.typecheck]
description = "Run tsc"
run = "tsc"
[tasks.test]
description = "Run tests"
run = "bun test --coverage"
[tasks.test-staged]
description = "Run tests on staged files"
run = "bun test --changed --bail --reporter=dots"
[tasks.test-ci]
description = "Run tests in ci mode"
run = "bun test --bail --reporter=dots"
[tasks.publish-app-error]
description = "Build and publishes @mkvlrn/app-error to npm and jsr"
run = """
echo "Clean..."
rm -rf packages/app-error/dist

echo "Building @mkvlrn/app-error..."
bun build ./packages/app-error/src/main.ts --outdir ./packages/app-error/dist
tsc --declaration --emitDeclarationOnly --outDir packages/app-error/dist --module ESNext --moduleResolution Bundler packages/app-error/src/main.ts --ignoreConfig

echo "Publishing @mkvlrn/app-error to npm..."
(cd packages/app-error && npm publish --access public)

echo "Publishing @mkvlrn/app-error to jsr..."
(cd packages/app-error && jsr publish)
"""
[tasks.publish-config]
description = "Build and publishes @mkvlrn/config to npm and jsr"
run = """
echo "Clean..."
rm -rf packages/config/dist

echo "Building @mkvlrn/config..."
bun build ./packages/config/src/vitest.config.ts --outdir ./packages/config/dist --external vite --external vitest
tsc --declaration --emitDeclarationOnly --outDir packages/config/dist --module ESNext --moduleResolution Bundler packages/config/src/*.ts --ignoreConfig
cp packages/config/src/.biome.json packages/config/dist/biome.json
cp packages/config/src/tsconfig.json packages/config/dist/tsconfig.json

echo "Publishing @mkvlrn/config to npm..."
(cd packages/config && npm publish --access public)

echo "Publishing @mkvlrn/config to jsr..."
(cd packages/config && jsr publish)
"""
[tasks.publish-result]
description = "Build and publishes @mkvlrn/result to npm and jsr"
run = """
echo "Clean..."
rm -rf packages/result/dist

echo "Building @mkvlrn/result..."
bun build ./packages/result/src/main.ts --outdir ./packages/result/dist
tsc --declaration --emitDeclarationOnly --outDir packages/result/dist --module ESNext --moduleResolution Bundler packages/result/src/main.ts --ignoreConfig

echo "Publishing @mkvlrn/result to npm..."
(cd packages/result && npm publish --access public)

echo "Publishing @mkvlrn/result to jsr..."
(cd packages/result && jsr publish)
"""
[tasks.jsr-dry-run]
description = "Checks for jsr slow types in each package"
run = """
for dir in packages/*; do
  if [ -d "$dir" ]; then
    echo "Checking $dir"
    (cd "$dir" && jsr publish --dry-run)
  fi
done
"""
